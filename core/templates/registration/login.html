{% extends "core/base.html" %}
{% block title %}Accesso{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3">Riconcilia</h1>
      <p class="text-muted small">Riconciliazione incassi, pagamenti, fatture e corrispettivi</p>
      {% if form.errors %}<div class="alert alert-danger py-2">Credenziali non valide.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" autofocus required></div>
        <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100">Accedi</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
